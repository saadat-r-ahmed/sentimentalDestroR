name: CI

on:
  push:
    branches: [journal-revision, main]
  pull_request:
    branches: [journal-revision, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Unit tests
        run: uv run pytest tests/ -v --tb=short

      - name: Smoke test (10 samples, paraphrase attack, mocked)
        run: uv run python -m pytest tests/ -v -k "not labse and not perplexity"
