[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "destror"
version = "0.2.0"
description = "destroR: Adversarial attacks on Bangla transfer models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "accelerate>=0.29.0",
    "sentence-transformers>=3.0.0",   # LaBSE
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "wandb>=0.17.0",
    "dvc>=3.50.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "bnlp-toolkit>=4.4.0",
    # normalizer (csebuetnlp) conflicts with bnlp-toolkit via ftfy.
    # Install in a separate env or via: pip install git+https://github.com/csebuetnlp/normalizer
    # The attack code wraps imports in try/except and degrades gracefully.
    "sacrebleu>=2.4.0",              # BLEU / chrF
    "bert-score>=0.3.13",
    "scipy>=1.10.0",
    "textattack>=0.3.10",            # baseline attacks (TextFooler, BAE, PWWS)
    "nltk>=3.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
destror-attack   = "destror.cli.run_attack:main"
destror-baseline = "destror.cli.run_baseline:main"
destror-transfer = "destror.cli.run_transfer:main"
destror-adv-train = "destror.cli.run_adv_training:main"
destror-aggregate = "destror.cli.aggregate_results:main"

[tool.hatch.build.targets.wheel]
packages = ["src/destror"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/destror --cov-report=term-missing"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"
