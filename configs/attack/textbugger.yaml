# @package _global_
attack:
  name: textbugger
  similarity_threshold: 0.7
  perturbation_budget: 0.20
  masker: csebuetnlp/banglabert
  top_k: 10

dataset:
  names: [blp23, youtube, cognisenti, basa_cricket]
  split: test
  max_samples: null

model:
  victims: [banglabert, banglishbert, xlm-r, muril, indicbertv2, titulm-1b]

run:
  seeds: [42, 1337, 2024]
  output_dir: results/raw_runs
  wandb: true
